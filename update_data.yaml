name: Auto-Update Avverkning Data

# Runs on the 1st of every month at midnight, OR when you click "Run workflow" manually
on:
  schedule:
    - cron: '0 0 1 * *' 
  workflow_dispatch:

jobs:
  process-map-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GDAL, Unzip, and Hugging Face CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip python3-pip
          pip3 install -U "huggingface_hub[cli]"

      - name: Install Tippecanoe
        run: |
          git clone https://github.com/felt/tippecanoe.git
          cd tippecanoe
          make -j
          sudo make install

      - name: Download & Extract Skogsstyrelsen Data
        run: |
          echo "Fetching XML feed..."
          ZIP_URL=$(curl -s https://geodpags.skogsstyrelsen.se/geodataport/feeds/UtfordAvverk.xml | grep -o 'https://[^"]*sksUtfordAvverk_gpkg.zip' | head -n 1)
          
          echo "Downloading $ZIP_URL..."
          wget -O data.zip "$ZIP_URL"
          
          echo "Extracting..."
          unzip data.zip
          
          # Delete the ZIP to save space on the GitHub server
          rm data.zip

      - name: Convert to GeoJSON and PMTiles
        run: |
          echo "Converting to GeoJSON (This takes a few minutes)..."
          ogr2ogr -t_srs EPSG:4326 -f GeoJSONSeq avv.geojsonl sksUtfordAvverk.gpkg -sql "SELECT geom, Arendear AS year, Arealha AS area, Avverktyp AS type, Beteckn AS id FROM UtfordAvverkningYta"
          
          # Delete the massive GPKG file to free up more space
          rm sksUtfordAvverk.gpkg
          
          echo "Building PMTiles..."
          tippecanoe -o avverkningar.pmtiles -l avverk -Z4 -z13 --drop-densest-as-needed --coalesce-densest-as-needed avv.geojsonl --force

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Uploading to Hugging Face dataset..."
          # Make sure this matches your dataset name!
          huggingface-cli upload koolremhaas/Deforestation_Data_Sweden avverkningar.pmtiles avverkningar.pmtiles --repo-type dataset
