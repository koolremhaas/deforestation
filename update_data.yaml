name: Auto-Update Avverkning Data

# This makes the script run automatically on the 1st of every month at midnight
# It also lets you click a button to run it manually ("workflow_dispatch")
on:
  schedule:
    - cron: '0 0 1 * *' 
  workflow_dispatch:

jobs:
  process-map-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GDAL and Hugging Face CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-pip
          pip3 install -U "huggingface_hub[cli]"

      - name: Install Tippecanoe
        run: |
          git clone https://github.com/felt/tippecanoe.git
          cd tippecanoe
          make -j
          sudo make install

      - name: Download & Extract Skogsstyrelsen Data
        run: |
          # 1. Grab the actual ZIP URL from the XML feed using grep/sed
          ZIP_URL=$(curl -s https://geodpags.skogsstyrelsen.se/geodataport/feeds/UtfordAvverk.xml | grep -o 'https://[^"]*sksUtfordAvverk_gpkg.zip')
          
          # 2. Download and unzip it
          wget -O data.zip "$ZIP_URL"
          unzip data.zip

      - name: Convert to PMTiles
        run: |
          # Adjust the -select fields once you know the exact names from ogrinfo
          ogr2ogr -t_srs EPSG:4326 -f GeoJSONSeq avv.geojsonl sksUtfordAvverk.gpkg -select year,area,type
          
          tippecanoe -o avverkningar.pmtiles -l avverk -Z4 -z13 --drop-densest-as-needed --coalesce-densest-as-needed avv.geojsonl

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # This replaces the old file in your dataset with the new one
          huggingface-cli upload koolremhaas/Deforestation_Data_Sweden avverkningar.pmtiles avverkningar.pmtiles --repo-type dataset
