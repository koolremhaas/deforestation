name: Auto-Update Avverkning Data

on:
  schedule:
    - cron: '0 0 1 * *' 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  process-map-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GDAL, Unzip, and Hugging Face Hub
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin unzip python3-pip
          pip3 install --upgrade huggingface_hub

      - name: Install Tippecanoe
        run: |
          git clone https://github.com/felt/tippecanoe.git
          cd tippecanoe
          make -j$(nproc)
          sudo make install

      - name: Download & Extract Skogsstyrelsen Data
        run: |
          echo "Fetching XML feed..."
          ZIP_URL=$(curl -s https://geodpags.skogsstyrelsen.se/geodataport/feeds/UtfordAvverk.xml | grep -o 'https://[^"]*sksUtfordAvverk_gpkg.zip' | head -n 1)
          
          echo "Downloading $ZIP_URL..."
          wget -O data.zip "$ZIP_URL"
          
          echo "Extracting..."
          unzip -q data.zip
          rm data.zip

      - name: Convert to GeoJSON and PMTiles
        run: |
          echo "Converting to GeoJSONSeq..."
          ogr2ogr -t_srs EPSG:4326 -f GeoJSONSeq avv.geojsonl sksUtfordAvverk.gpkg -sql "SELECT geom, Arendear AS year, Arealha AS area, Avverktyp AS type, Beteckn AS id FROM UtfordAvverkningYta"
          
          rm sksUtfordAvverk.gpkg
          
          echo "Building PMTiles with Tippecanoe..."
          tippecanoe -o avverkningar.pmtiles -l avverk -Z4 -z13 --drop-densest-as-needed --coalesce-densest-as-needed avv.geojsonl --force
          
          rm avv.geojsonl

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          FILE_SIZE=$(stat -c%s "avverkningar.pmtiles")
          if [ "$FILE_SIZE" -lt 104857600 ]; then
            echo "Error: Generated file is too small ($FILE_SIZE bytes). Aborting upload."
            exit 1
          fi
          
          echo "File size: $FILE_SIZE bytes. Uploading to Hugging Face..."
          python3 -c "import os; from huggingface_hub import HfApi; api = HfApi(token=os.environ['HF_TOKEN']); api.upload_file(path_or_fileobj='avverkningar.pmtiles', path_in_repo='avverkningar.pmtiles', repo_id='koolremhaas/Deforestation_Data_Sweden', repo_type='dataset')"
